<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Folded Option 1 - Book Open</title>
    <link rel="stylesheet" href="folded-options.css">
  </head>
  <body>
    <div class="option-note">Folded 1 - Book Open</div>
    <main class="page">
      <input id="book-toggle" class="unfold-check" type="checkbox">
      <section class="book-card">
        <section class="book-inside">
          <div class="book-art">
            <img class="lily" src="../assets/lily-of-the-valley.png" alt="Lily of the valley flowers">
          </div>
          <div class="book-content content">
            <h1>Happy birthday</h1>
            <p class="subtitle">The best present is the present. Here are some of the past presents that live as memories.</p>
            <form class="form">
              <label>Something you were told<input type="password"></label>
              <label>Something you know<input type="password"></label>
              <div class="actions">
                <button type="button">Unlock</button>
                <button type="button" class="secondary">Random greeting</button>
              </div>
            </form>
            <div class="mini-greeting">40 is the new 25.</div>
          </div>
        </section>
        <section class="book-cover">
          <div class="book-cover-inner">
            <div>
              <p class="book-cover-title">Happy birthday</p>
              <p class="book-cover-small">Tap to open</p>
              <img src="../assets/lily-of-the-valley.png" alt="">
            </div>
          </div>
        </section>
        <label class="gate" for="book-toggle" aria-label="Open the card"></label>
      </section>
      <p class="hint">Click or tap the front cover to unfold the card.</p>
    </main>
  </body>
</html>
