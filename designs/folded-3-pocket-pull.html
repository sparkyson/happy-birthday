<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Folded Option 3 - Pocket Pull Card</title>
    <link rel="stylesheet" href="folded-options.css">
  </head>
  <body>
    <div class="option-note">Folded 3 - Pocket Pull</div>
    <main class="page">
      <input id="pocket-toggle" class="unfold-check" type="checkbox">
      <section class="pocket-wrap">
        <div class="pull-tab">Pull to open</div>
        <article class="pull-card">
          <div class="pull-art">
            <img class="lily" src="../assets/lily-of-the-valley.png" alt="Lily of the valley flowers">
          </div>
          <div class="pull-content content">
            <h1>Happy birthday</h1>
            <p class="subtitle">The best present is the present. Here are some of the past presents that live as memories.</p>
            <form class="form">
              <label>Something you were told<input type="password"></label>
              <label>Something you know<input type="password"></label>
              <div class="actions">
                <button type="button">Unlock</button>
                <button type="button" class="secondary">Random greeting</button>
              </div>
            </form>
            <div class="mini-greeting">The best is yet to come.</div>
          </div>
        </article>
        <section class="pocket" aria-hidden="true"></section>
        <label class="gate" for="pocket-toggle" aria-label="Pull the card from the pocket"></label>
      </section>
      <p class="hint">Click or tap the pull tab to reveal the card.</p>
    </main>
  </body>
</html>
