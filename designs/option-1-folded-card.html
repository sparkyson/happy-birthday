<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Option 1 - Folded Paper Card</title>
    <link rel="stylesheet" href="design-options.css">
  </head>
  <body class="folded-page">
    <div class="option-note">Option 1 - Folded Paper Card</div>
    <main class="folded-card">
      <section class="folded-art" aria-label="Lily of the valley birthday illustration">
        <img src="../assets/lily-of-the-valley.png" alt="Lily of the valley flowers">
      </section>
      <section class="folded-content">
        <h1>Happy birthday</h1>
        <p class="subtitle">The best present is the present. Here are some of the past presents that live as memories.</p>
        <form class="form">
          <label>
            Something you were told
            <input type="password">
          </label>
          <label>
            Something you know
            <input type="password">
          </label>
          <div class="actions">
            <button type="button">Unlock</button>
            <button type="button" class="secondary">Random greeting</button>
          </div>
        </form>
        <div class="random-strip">40 is the new 25.</div>
      </section>
    </main>
  </body>
</html>
