<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Option 2 - Envelope Reveal</title>
    <link rel="stylesheet" href="design-options.css">
  </head>
  <body class="envelope-page">
    <div class="option-note">Option 2 - Envelope Reveal</div>
    <main class="envelope-scene">
      <div class="envelope-flap" aria-hidden="true"></div>
      <section class="envelope-body">
        <div class="seal" aria-hidden="true">40</div>
        <article class="envelope-card">
          <div class="envelope-copy">
            <h1>Happy birthday</h1>
            <p class="subtitle">The best present is the present. Here are some of the past presents that live as memories.</p>
            <form class="form">
              <label>
                Something you were told
                <input type="password">
              </label>
              <label>
                Something you know
                <input type="password">
              </label>
              <div class="actions">
                <button type="button">Unlock</button>
                <button type="button" class="secondary">Random greeting</button>
              </div>
            </form>
            <div class="random-strip">Cake first, questions later.</div>
          </div>
          <img src="../assets/lily-of-the-valley.png" alt="Lily of the valley flowers">
        </article>
      </section>
    </main>
  </body>
</html>
