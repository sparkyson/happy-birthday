<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Option 3 - Botanical Birthday Postcard</title>
    <link rel="stylesheet" href="design-options.css">
  </head>
  <body class="postcard-page">
    <div class="option-note">Option 3 - Botanical Postcard</div>
    <main class="postcard">
      <section class="postcard-image" aria-label="Lily of the valley postcard image">
        <div class="stamp">Birthday Post</div>
        <img src="../assets/lily-of-the-valley.png" alt="Lily of the valley flowers">
      </section>
      <section class="postcard-note">
        <div class="postmark">Memory mail</div>
        <h1>Happy birthday</h1>
        <p class="subtitle">The best present is the present. Here are some of the past presents that live as memories.</p>
        <form class="form">
          <label>
            Something you were told
            <input type="password">
          </label>
          <label>
            Something you know
            <input type="password">
          </label>
          <div class="actions">
            <button type="button">Unlock</button>
            <button type="button" class="secondary">Random greeting</button>
          </div>
        </form>
        <div class="random-strip">The best is yet to come.</div>
      </section>
    </main>
  </body>
</html>
